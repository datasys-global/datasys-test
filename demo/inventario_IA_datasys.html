<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Datasys · Inventario IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --cyan:#00e5ff;--cyan-dim:#00b8cc;--dark:#050a0f;--dark2:#0a1520;--dark3:#0d1f2d;
    --card:#0d1f2d;--border:rgba(0,229,255,0.2);--border-bright:rgba(0,229,255,0.6);
    --text:#c8f0f8;--text-dim:#6a8fa0;--success:#00ff88;--warn:#ffb300;--danger:#ff4444;
  }
  html,body{height:100%;overflow:hidden}
  body{background:var(--dark);color:var(--text);font-family:'Exo 2',sans-serif;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}

  /* HEADER */
  .header{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--border);background:var(--dark2);flex-shrink:0}
  .logo-img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(0,229,255,0.5))}
  .header-title{font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:2px;color:var(--cyan)}
  .header-sub{font-size:10px;color:var(--text-dim);letter-spacing:1px}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);margin-left:auto;box-shadow:0 0 8px var(--success);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  /* TABS */
  .tabs{display:flex;border-bottom:1px solid var(--border);background:var(--dark2);flex-shrink:0}
  .tab{flex:1;padding:11px 4px;text-align:center;font-size:11px;letter-spacing:1px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-family:'Exo 2',sans-serif;background:none;border-top:none;border-left:none;border-right:none;touch-action:manipulation}
  .tab.active{color:var(--cyan);border-bottom:2px solid var(--cyan)}

  /* PANELS */
  .panel{display:none;flex:1;flex-direction:column;padding:14px;overflow-y:auto;overflow-x:hidden}
  .panel.active{display:flex}

  /* CAMERA */
  .mode-toggle{display:flex;gap:6px;margin-bottom:12px;flex-shrink:0}
  .mode-btn{flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:10px;cursor:pointer;transition:all .2s;letter-spacing:1px;font-family:'Exo 2',sans-serif;touch-action:manipulation}
  .mode-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.07)}

  .cam-wrapper{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:#000;aspect-ratio:4/3;flex-shrink:0}
  video{width:100%;height:100%;object-fit:cover;display:block}
  canvas#snapCanvas{display:none}

  .cam-start{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;cursor:pointer;background:var(--card)}
  .cam-start-icon{font-size:44px;opacity:.35}
  .cam-start-text{font-size:11px;color:var(--text-dim);letter-spacing:2px;font-family:'Orbitron',sans-serif;text-align:center}

  .cam-overlay{position:absolute;inset:0;pointer-events:none;display:none}
  .corner{position:absolute;width:22px;height:22px;border-color:var(--cyan);border-style:solid}
  .corner.tl{top:8px;left:8px;border-width:2px 0 0 2px}
  .corner.tr{top:8px;right:8px;border-width:2px 2px 0 0}
  .corner.bl{bottom:8px;left:8px;border-width:0 0 2px 2px}
  .corner.br{bottom:8px;right:8px;border-width:0 2px 2px 0}
  .scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);top:10%;opacity:0;transition:opacity .3s}
  .scan-line.active{opacity:1;animation:scan 1.8s linear infinite}
  @keyframes scan{0%{top:10%}100%{top:90%}}
  .cam-label{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:3px;color:var(--cyan);font-family:'Orbitron',sans-serif;background:rgba(5,10,15,.6);padding:4px 10px;border-radius:4px}

  .cam-controls{display:none;gap:8px;margin-top:10px;align-items:center;flex-shrink:0}
  .btn-capture{flex:1;padding:13px;background:var(--cyan);color:var(--dark);font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:2px;border:none;border-radius:8px;cursor:pointer;font-weight:700;transition:all .15s;touch-action:manipulation}
  .btn-capture:hover{opacity:.85}
  .btn-capture:disabled{opacity:.35;cursor:not-allowed}
  .btn-capture:active{transform:scale(0.97)}
  .btn-sm{padding:11px 14px;background:transparent;color:var(--cyan);border:1px solid var(--border-bright);border-radius:8px;font-size:13px;cursor:pointer;transition:all .15s;touch-action:manipulation;flex-shrink:0}
  .btn-sm:hover{background:rgba(0,229,255,.08)}

  /* SPINNER */
  .spinner{display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;flex-shrink:0}
  .spinner.active{display:flex}
  .spin-ring{width:36px;height:36px;border:2px solid var(--border);border-top:2px solid var(--cyan);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin-text{font-size:10px;color:var(--text-dim);letter-spacing:3px;font-family:'Orbitron',sans-serif}

  /* RESULT BOX */
  .result-box{display:none;border:1px solid var(--border);border-radius:8px;background:var(--card);padding:12px;flex-shrink:0;margin-top:10px}
  .result-box.visible{display:block}
  .result-header{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:2px;color:var(--cyan-dim);margin-bottom:8px}
  .result-items{display:flex;flex-direction:column;gap:6px}
  .detected-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(0,229,255,.04);border-radius:6px;border-left:2px solid var(--cyan)}
  .det-icon{font-size:18px;flex-shrink:0}
  .det-name{font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .det-conf{font-size:11px;color:var(--text-dim);flex-shrink:0}
  .det-qty-ctrl{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .det-qty-btn{width:22px;height:22px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:monospace;touch-action:manipulation}
  .det-qty-btn:hover{border-color:var(--cyan);color:var(--cyan)}
  .det-qty-num{font-family:'Orbitron',sans-serif;font-size:12px;color:var(--cyan);min-width:20px;text-align:center}
  .add-all-btn{margin-top:10px;width:100%;padding:10px;background:transparent;border:1px solid var(--success);color:var(--success);border-radius:7px;font-size:11px;cursor:pointer;letter-spacing:1px;transition:all .2s;font-family:'Exo 2',sans-serif;touch-action:manipulation}
  .add-all-btn:hover{background:rgba(0,255,136,.08)}
  .add-all-btn:active{transform:scale(0.98)}

  /* INVENTORY */
  .inv-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-shrink:0}
  .inv-title{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:2px;color:var(--cyan);flex:1}
  .inv-count{background:var(--cyan);color:var(--dark);font-size:10px;padding:3px 9px;border-radius:12px;font-family:'Orbitron',sans-serif;font-weight:700}
  .search-box{display:flex;gap:8px;margin-bottom:12px;flex-shrink:0}
  .search-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:7px;padding:10px 12px;color:var(--text);font-size:13px;font-family:'Exo 2',sans-serif;outline:none;-webkit-appearance:none}
  .search-input:focus{border-color:var(--cyan-dim)}
  .search-input::placeholder{color:var(--text-dim)}
  .export-btn{padding:10px 12px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--text-dim);font-size:11px;cursor:pointer;transition:all .2s;font-family:'Exo 2',sans-serif;white-space:nowrap;touch-action:manipulation}
  .export-btn:hover{border-color:var(--cyan);color:var(--cyan)}

  .stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;flex-shrink:0}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
  .stat-val{font-family:'Orbitron',sans-serif;font-size:22px;color:var(--cyan);font-weight:700;line-height:1}
  .stat-lbl{font-size:10px;color:var(--text-dim);margin-top:4px;letter-spacing:1px}

  .inv-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1}
  .inv-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 14px;display:flex;align-items:center;gap:10px;transition:border-color .2s;flex-shrink:0}
  .inv-item:hover{border-color:var(--cyan-dim)}
  .item-icon{width:38px;height:38px;border-radius:7px;background:rgba(0,229,255,.08);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .item-info{flex:1;min-width:0}
  .item-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-meta{font-size:11px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-qty-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .qty-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:monospace;touch-action:manipulation}
  .qty-btn:hover{border-color:var(--cyan);color:var(--cyan)}
  .qty-num{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--cyan);min-width:26px;text-align:center}
  .del-btn{width:28px;height:28px;border-radius:5px;border:1px solid rgba(255,68,68,.3);background:transparent;color:var(--danger);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-left:2px;transition:all .15s;touch-action:manipulation}
  .del-btn:hover{background:rgba(255,68,68,.1)}

  .empty-state{display:flex;flex-direction:column;align-items:center;padding:40px 20px;color:var(--text-dim);font-size:12px;gap:12px;text-align:center;letter-spacing:1px;font-family:'Orbitron',sans-serif}
  .empty-icon{font-size:40px;opacity:.25}

  /* HISTORY */
  .hist-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1}
  .hist-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;flex-shrink:0}
  .hist-time{font-size:10px;color:var(--text-dim);margin-bottom:4px;letter-spacing:1px;font-family:'Orbitron',sans-serif}
  .hist-content{color:var(--text);font-size:12px;line-height:1.5}
  .hist-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:9px;margin-right:5px;font-family:'Orbitron',sans-serif;letter-spacing:1px}
  .badge-scan{background:rgba(0,229,255,.12);color:var(--cyan);border:1px solid var(--border)}
  .badge-add{background:rgba(0,255,136,.12);color:var(--success);border:1px solid rgba(0,255,136,.25)}
  .badge-del{background:rgba(255,68,68,.12);color:var(--danger);border:1px solid rgba(255,68,68,.25)}

  /* ALERT TOAST */
  .alert{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--dark2);border:1px solid var(--cyan);color:var(--cyan);padding:10px 22px;border-radius:8px;font-size:11px;letter-spacing:2px;font-family:'Orbitron',sans-serif;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;box-shadow:0 0 20px rgba(0,229,255,.2)}
  .alert.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* MANUAL ADD */
  .manual-add{display:flex;gap:8px;margin-top:10px;flex-shrink:0}
  .manual-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:7px;padding:9px 12px;color:var(--text);font-size:13px;font-family:'Exo 2',sans-serif;outline:none;-webkit-appearance:none}
  .manual-input:focus{border-color:var(--cyan-dim)}
  .manual-input::placeholder{color:var(--text-dim)}
  .btn-add-manual{padding:9px 14px;background:transparent;border:1px solid var(--cyan);color:var(--cyan);border-radius:7px;font-size:11px;cursor:pointer;font-family:'Exo 2',sans-serif;letter-spacing:1px;touch-action:manipulation;white-space:nowrap}
  .btn-add-manual:hover{background:rgba(0,229,255,.08)}

  /* GRID BG PATTERN */
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.03) 1px,transparent 1px);background-size:30px 30px;pointer-events:none;z-index:0}
  .app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <img class="logo-img" src="../imagenes/logo.png" alt="Datasys Logo">
    <div>
      <div class="header-title">DATASYS</div>
      <div class="header-sub">INVENTARIO · IA</div>
    </div>
    <div class="status-dot" id="statusDot"></div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('cam')">📷 CÁMARA</button>
    <button class="tab" onclick="switchTab('inv')">📦 INVENTARIO</button>
    <button class="tab" onclick="switchTab('hist')">📋 HISTORIAL</button>
  </div>

  <!-- ═══════════════ CAMERA PANEL ═══════════════ -->
  <div class="panel active" id="panel-cam">
    <div class="mode-toggle">
      <button class="mode-btn active" id="mode-objects" onclick="setMode('objects')">OBJETOS</button>
      <button class="mode-btn" id="mode-text" onclick="setMode('text')">TEXTO/QR</button>
      <button class="mode-btn" id="mode-both" onclick="setMode('both')">AMBOS</button>
    </div>

    <!-- Video feed -->
    <div class="cam-wrapper" id="camWrapper">
      <div class="cam-start" id="camStart" onclick="startCamera()">
        <div class="cam-start-icon">📷</div>
        <div class="cam-start-text">TOCA PARA<br>ACTIVAR CÁMARA</div>
      </div>
      <video id="video" autoplay playsinline muted style="display:none"></video>
      <canvas id="snapCanvas"></canvas>
      <div class="cam-overlay" id="camOverlay">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="scan-line" id="scanLine"></div>
        <div class="cam-label" id="camLabel">LISTO PARA ESCANEAR</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="cam-controls" id="camControls">
      <button class="btn-sm" onclick="switchCam()" title="Cambiar cámara">🔄</button>
      <button class="btn-capture" id="captureBtn" onclick="capture()">⚡ ESCANEAR</button>
      <button class="btn-sm" onclick="stopCamera()" title="Apagar cámara">✕</button>
    </div>

    <!-- Manual add -->
    <div class="manual-add">
      <input class="manual-input" id="manualInput" placeholder="Agregar artículo manual..." maxlength="60">
      <button class="btn-add-manual" onclick="addManual()">+ AGREGAR</button>
    </div>

    <!-- Spinner -->
    <div class="spinner" id="spinner">
      <div class="spin-ring"></div>
      <div class="spin-text">ANALIZANDO CON IA...</div>
    </div>

    <!-- Results -->
    <div class="result-box" id="resultBox">
      <div class="result-header">✦ DETECCIÓN IA — CONFIRMAR ÍTEMS</div>
      <div class="result-items" id="resultItems"></div>
      <button class="add-all-btn" onclick="addAllToInventory()">+ AGREGAR TODO AL INVENTARIO</button>
    </div>
  </div>

  <!-- ═══════════════ INVENTORY PANEL ═══════════════ -->
  <div class="panel" id="panel-inv">
    <div class="inv-header">
      <div class="inv-title">INVENTARIO</div>
      <div class="inv-count" id="invCount">0</div>
    </div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-val" id="statItems">0</div>
        <div class="stat-lbl">ARTÍCULOS</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statUnits">0</div>
        <div class="stat-lbl">UNIDADES TOTALES</div>
      </div>
    </div>
    <div class="search-box">
      <input class="search-input" id="searchInput" placeholder="🔍 Buscar artículo..." oninput="renderInventory()">
      <button class="export-btn" onclick="exportCSV()">⬇ CSV</button>
    </div>
    <div class="inv-list" id="invList"></div>
  </div>

  <!-- ═══════════════ HISTORY PANEL ═══════════════ -->
  <div class="panel" id="panel-hist">
    <div class="inv-header">
      <div class="inv-title">HISTORIAL</div>
      <button class="btn-sm" onclick="clearHistory()" style="font-size:10px;padding:6px 12px">LIMPIAR</button>
    </div>
    <div class="hist-list" id="histList"></div>
  </div>

</div><!-- /app -->

<div class="alert" id="alert"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let inventory = JSON.parse(localStorage.getItem('ds_inv') || '[]');
let history   = JSON.parse(localStorage.getItem('ds_hist') || '[]');
let scanMode  = 'objects';
let stream    = null;
let facingMode = 'environment';
let lastDetected = [];

// ── Icons ──────────────────────────────────────────────────────────────────
const ICONS = {
  laptop:'💻', notebook:'💻', computer:'🖥', monitor:'🖥', desktop:'🖥',
  phone:'📱', smartphone:'📱', tablet:'📱', ipad:'📱', iphone:'📱',
  keyboard:'⌨', mouse:'🖱', cable:'🔌', charger:'🔌', usb:'🔌',
  headphones:'🎧', headset:'🎧', speaker:'🔊', microphone:'🎙',
  camera:'📷', webcam:'📷', printer:'🖨',
  book:'📚', manual:'📄', document:'📄', paper:'📄', notebook2:'📓',
  folder:'📁', binder:'📁',
  pen:'🖊', pencil:'✏', marker:'🖍', scissors:'✂',
  bottle:'🧴', cup:'☕', mug:'☕', glass:'🥤', water:'💧',
  box:'📦', package:'📦', container:'📦',
  chair:'🪑', table:'🪑', desk:'🖥',
  lamp:'💡', light:'💡',
  bag:'🎒', backpack:'🎒', briefcase:'💼',
  watch:'⌚', glasses:'👓',
  clock:'⏰', calendar:'📅',
  key:'🔑', lock:'🔒',
  tool:'🔧', screwdriver:'🔧', wrench:'🔧',
  plant:'🌿', flower:'🌸',
  food:'🍎', apple:'🍎', banana:'🍌',
  card:'💳', wallet:'👛',
  default:'📦'
};

function getIcon(name) {
  if (!name) return ICONS.default;
  const n = name.toLowerCase();
  for (const [k, v] of Object.entries(ICONS)) {
    if (n.includes(k)) return v;
  }
  return ICONS.default;
}

// ── Persistence ────────────────────────────────────────────────────────────
function save() {
  try {
    localStorage.setItem('ds_inv', JSON.stringify(inventory));
    localStorage.setItem('ds_hist', JSON.stringify(history.slice(0, 100)));
  } catch(e) {}
}

// ── Tab switching ──────────────────────────────────────────────────────────
function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', ['cam','inv','hist'][i] === t);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + t).classList.add('active');
  if (t === 'inv') renderInventory();
  if (t === 'hist') renderHistory();
}

// ── Scan mode ──────────────────────────────────────────────────────────────
function setMode(m) {
  scanMode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mode-' + m).classList.add('active');
}

// ── Camera ─────────────────────────────────────────────────────────────────
async function startCamera() {
  if (stream) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false
    });
    const v = document.getElementById('video');
    v.srcObject = stream;
    v.style.display = 'block';
    document.getElementById('camStart').style.display = 'none';
    document.getElementById('camOverlay').style.display = 'block';
    document.getElementById('camControls').style.display = 'flex';
    showAlert('CÁMARA ACTIVA');
  } catch(e) {
    showAlert('ERROR CÁMARA: ' + (e.message || 'permisos denegados').toUpperCase().slice(0, 30));
  }
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  const v = document.getElementById('video');
  v.srcObject = null;
  v.style.display = 'none';
  document.getElementById('camStart').style.display = 'flex';
  document.getElementById('camOverlay').style.display = 'none';
  document.getElementById('camControls').style.display = 'none';
  document.getElementById('resultBox').classList.remove('visible');
  document.getElementById('scanLine').classList.remove('active');
}

async function switchCam() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  await startCamera();
}

function captureFrame() {
  const v = document.getElementById('video');
  const c = document.getElementById('snapCanvas');
  c.width  = v.videoWidth  || 640;
  c.height = v.videoHeight || 480;
  c.getContext('2d').drawImage(v, 0, 0);
  return c.toDataURL('image/jpeg', 0.85).split(',')[1];
}

// ── AI Capture ─────────────────────────────────────────────────────────────
async function capture() {
  if (!stream) { showAlert('ACTIVA LA CÁMARA PRIMERO'); return; }

  const sl  = document.getElementById('scanLine');
  const lbl = document.getElementById('camLabel');
  const btn = document.getElementById('captureBtn');

  sl.classList.add('active');
  lbl.textContent = 'ANALIZANDO...';
  btn.disabled = true;
  document.getElementById('spinner').classList.add('active');
  document.getElementById('resultBox').classList.remove('visible');

  const imageData = captureFrame();

  const prompts = {
    objects: `You are an inventory scanner. Analyze this image and identify ALL visible physical objects/items.
Respond ONLY with a valid JSON array. No markdown fences, no explanation, just pure JSON like:
[{"name":"Laptop","quantity":1,"confidence":"95%","category":"electronics"},{"name":"Coffee Mug","quantity":2,"confidence":"88%","category":"kitchen"}]
Be specific with names. Include brand/model if visible. List every distinct item type you can see.`,

    text: `You are an OCR and barcode scanner. Extract ALL visible text, product labels, barcodes, QR codes, serial numbers, and product names from this image.
Respond ONLY with a valid JSON array. No markdown, no explanation, just pure JSON like:
[{"name":"Product: XYZ Widget Pro","quantity":1,"confidence":"97%","category":"label"},{"name":"Barcode: 7501055361045","quantity":1,"confidence":"99%","category":"barcode"},{"name":"Text: Model A200","quantity":1,"confidence":"95%","category":"text"}]`,

    both: `You are a smart inventory scanner combining object detection and OCR.
1. Identify all visible physical objects/items.
2. Extract all visible text, barcodes, QR codes, and labels.
Respond ONLY with a valid JSON array. No markdown, no explanation, just pure JSON like:
[{"name":"Laptop Dell XPS","quantity":1,"confidence":"92%","category":"electronics"},{"name":"Label: SN-2024-XPS","quantity":1,"confidence":"88%","category":"text"}]
Be thorough and specific.`
  };

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: imageData } },
            { type: 'text', text: prompts[scanMode] }
          ]
        }]
      })
    });

    const data = await resp.json();

    if (data.error) throw new Error(data.error.message || 'API error');

    const txt = (data.content || []).map(b => b.text || '').join('');
    let items = [];

    try {
      const clean = txt.replace(/```json|```/g, '').trim();
      const match = clean.match(/\[[\s\S]*\]/);
      if (match) items = JSON.parse(match[0]);
    } catch(e) {
      items = [{ name: 'Ítem detectado', quantity: 1, confidence: '—', category: 'general' }];
    }

    if (!items.length) {
      showAlert('NO SE DETECTARON ÍTEMS');
    } else {
      showResults(items);
      addHistory('scan', items.map(i => i.name).join(' · '), scanMode.toUpperCase());
    }

  } catch(e) {
    showAlert('ERROR: ' + (e.message || 'fallo de red').toUpperCase().slice(0, 35));
  } finally {
    sl.classList.remove('active');
    lbl.textContent = 'LISTO PARA ESCANEAR';
    btn.disabled = false;
    document.getElementById('spinner').classList.remove('active');
  }
}

// ── Results display ────────────────────────────────────────────────────────
function showResults(items) {
  lastDetected = items.map(i => ({ ...i, quantity: i.quantity || 1 }));
  const list = document.getElementById('resultItems');
  list.innerHTML = '';

  lastDetected.forEach((item, idx) => {
    const d = document.createElement('div');
    d.className = 'detected-item';
    d.innerHTML = `
      <span class="det-icon">${getIcon(item.name)}</span>
      <span class="det-name" title="${item.name}">${item.name}</span>
      <span class="det-conf">${item.confidence || '—'}</span>
      <div class="det-qty-ctrl">
        <button class="det-qty-btn" onclick="adjDet(${idx},-1)">−</button>
        <span class="det-qty-num" id="dqty-${idx}">${item.quantity}</span>
        <button class="det-qty-btn" onclick="adjDet(${idx},1)">+</button>
      </div>`;
    list.appendChild(d);
  });

  document.getElementById('resultBox').classList.add('visible');
}

function adjDet(idx, delta) {
  lastDetected[idx].quantity = Math.max(1, (lastDetected[idx].quantity || 1) + delta);
  document.getElementById('dqty-' + idx).textContent = lastDetected[idx].quantity;
}

function addAllToInventory() {
  let added = 0;
  lastDetected.forEach(item => {
    const existing = inventory.find(inv => inv.name.toLowerCase() === item.name.toLowerCase());
    if (existing) {
      existing.qty += (item.quantity || 1);
    } else {
      inventory.push({
        id: Date.now() + Math.random(),
        name: item.name,
        qty: item.quantity || 1,
        category: item.category || 'general',
        icon: getIcon(item.name),
        added: new Date().toISOString()
      });
    }
    addHistory('add', item.name, '+' + (item.quantity || 1));
    added++;
  });
  save();
  showAlert(added + ' ÍTEM(S) AGREGADOS ✓');
  document.getElementById('resultBox').classList.remove('visible');
  lastDetected = [];
  updateStats();
}

// ── Manual add ─────────────────────────────────────────────────────────────
function addManual() {
  const input = document.getElementById('manualInput');
  const name = input.value.trim();
  if (!name) { showAlert('ESCRIBE UN NOMBRE'); return; }
  const existing = inventory.find(i => i.name.toLowerCase() === name.toLowerCase());
  if (existing) {
    existing.qty += 1;
    showAlert('CANTIDAD ACTUALIZADA');
  } else {
    inventory.push({
      id: Date.now() + Math.random(),
      name, qty: 1,
      category: 'manual',
      icon: getIcon(name),
      added: new Date().toISOString()
    });
    showAlert('ÍTEM AGREGADO');
  }
  addHistory('add', name, '+1 manual');
  input.value = '';
  save();
  updateStats();
}
document.getElementById('manualInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addManual();
});

// ── Inventory ──────────────────────────────────────────────────────────────
function updateStats() {
  const total = inventory.reduce((s, i) => s + i.qty, 0);
  document.getElementById('invCount').textContent = inventory.length;
  document.getElementById('statItems').textContent = inventory.length;
  document.getElementById('statUnits').textContent = total;
}

function renderInventory() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  const filtered = inventory.filter(i => i.name.toLowerCase().includes(q));
  const list = document.getElementById('invList');
  updateStats();

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📦</div>
      <div>${q ? 'SIN RESULTADOS' : 'INVENTARIO VACÍO'}<br>
      <span style="font-size:10px;font-weight:300;font-family:\'Exo 2\';letter-spacing:0.5px">${q ? 'intenta otra búsqueda' : 'usa la cámara o agrega manualmente'}</span></div>
    </div>`;
    return;
  }

  list.innerHTML = filtered.map(item => `
    <div class="inv-item">
      <div class="item-icon">${item.icon || getIcon(item.name)}</div>
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-meta">${item.category} · ${new Date(item.added).toLocaleDateString('es-MX')}</div>
      </div>
      <div class="item-qty-ctrl">
        <button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
        <button class="del-btn" onclick="deleteItem('${item.id}')" title="Eliminar">✕</button>
      </div>
    </div>`).join('');
}

function changeQty(id, d) {
  const item = inventory.find(i => String(i.id) === String(id));
  if (!item) return;
  item.qty = Math.max(0, item.qty + d);
  if (item.qty === 0) {
    if (confirm(`¿Eliminar "${item.name}" del inventario?`)) {
      deleteItem(id); return;
    } else { item.qty = 1; }
  }
  save();
  renderInventory();
}

function deleteItem(id) {
  const item = inventory.find(i => String(i.id) === String(id));
  if (item) { addHistory('del', item.name, 'eliminado'); }
  inventory = inventory.filter(i => String(i.id) !== String(id));
  save();
  renderInventory();
  showAlert('ÍTEM ELIMINADO');
}

// ── History ────────────────────────────────────────────────────────────────
function addHistory(type, content, extra) {
  history.unshift({
    type, content, extra,
    time: new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
    date: new Date().toLocaleDateString('es-MX')
  });
  if (history.length > 100) history.pop();
  save();
}

function renderHistory() {
  const list = document.getElementById('histList');
  if (!history.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div>SIN HISTORIAL</div></div>';
    return;
  }
  list.innerHTML = history.map(h => `
    <div class="hist-item">
      <div class="hist-time">${h.date} · ${h.time}</div>
      <div class="hist-content">
        <span class="hist-badge badge-${h.type}">${h.type.toUpperCase()}</span>
        ${h.content}
        ${h.extra ? `<span style="color:var(--text-dim)"> · ${h.extra}</span>` : ''}
      </div>
    </div>`).join('');
}

function clearHistory() {
  if (confirm('¿Limpiar todo el historial?')) {
    history = [];
    save();
    renderHistory();
    showAlert('HISTORIAL LIMPIADO');
  }
}

// ── Export CSV ─────────────────────────────────────────────────────────────
function exportCSV() {
  if (!inventory.length) { showAlert('INVENTARIO VACÍO'); return; }
  const BOM = '\uFEFF';
  const header = 'Nombre,Categoría,Cantidad,Fecha Agregado\n';
  const rows = inventory.map(i =>
    `"${i.name.replace(/"/g,'""')}","${i.category}",${i.qty},"${new Date(i.added).toLocaleDateString('es-MX')}"`
  ).join('\n');
  const blob = new Blob([BOM + header + rows], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `inventario_datasys_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showAlert('CSV EXPORTADO ✓');
}

// ── Alert toast ────────────────────────────────────────────────────────────
let alertTimer = null;
function showAlert(msg) {
  const a = document.getElementById('alert');
  a.textContent = msg;
  a.classList.add('show');
  if (alertTimer) clearTimeout(alertTimer);
  alertTimer = setTimeout(() => a.classList.remove('show'), 2400);
}

// ── Init ───────────────────────────────────────────────────────────────────
updateStats();
renderInventory();
</script>
</body>
</html>
